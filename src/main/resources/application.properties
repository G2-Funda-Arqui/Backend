# Spring Application Name
spring.application.name=medibridge

# Spring DataSource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medibridge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA Configuration
spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate
spring.jpa.hibernate.ddl-auto=create-drop

# SQL initialization
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Server
server.port=${SERVER_PORT:5000}

# JWT Configuration
authorization.jwt.secret=WriteHereYourSecretStringForTokenSigningCredentials
authorization.jwt.expiration.days=7

# OpenAPI / Documentation
documentation.application.description=@project.description@
documentation.application.version=@project.version@

# Logging
logging.level.org.springframework=INFO
# SnakeCase
spring.jpa.hibernate.naming.physical-strategy=pe.edu.upc.medibridge.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy